name: Maestro Android E2E

# Runs the existing guest Maestro suite (config/run-maestro-suite.ts android:
# onboarding, navigation, food, map, settings, public content, …) on an
# Android emulator against a debug build. Only guest flows run here; the
# authenticated flows need a staging test account and are run manually
# (see docs/testing.md). The app talks to the staging backend through the
# repository variables GRAPHQL_ENDPOINT_DEV / AUTH_URL_DEV / LOGIN_URL_DEV
# (GRAPHQL_ENDPOINT_DEV is already used by maestro-web.yml). The job is skipped
# until GRAPHQL_ENDPOINT_DEV is set, so tests never fall back to production.

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Maestro guest suite on Android emulator
    if: vars.GRAPHQL_ENDPOINT_DEV != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_HAWCONNECT_GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT_DEV }}
      EXPO_PUBLIC_HAWCONNECT_AUTH_URL: ${{ vars.AUTH_URL_DEV }}
      EXPO_PUBLIC_HAWCONNECT_LOGIN_URL: ${{ vars.LOGIN_URL_DEV }}
      APP_ID: dev.hawconnect.app.beta
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/android-prepare

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL --retry 3 --retry-all-errors 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Metro
        run: |
          bunx expo start --port 8081 > metro.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://localhost:8081/status && break
            sleep 2
          done

      - name: Run Maestro on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            bun e2e:android

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: |
            ~/.maestro/tests
            metro.log
          if-no-files-found: ignore
